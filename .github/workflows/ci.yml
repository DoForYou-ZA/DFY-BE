name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'docs/openapi.json'
      - 'docs/openapi.d.ts'
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DoForYou.API.csproj

      - name: Build API
        run: dotnet build DoForYou.API.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test DoForYou.Tests/DoForYou.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Export canonical OpenAPI contract
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DFY_OPENAPI_EXPORT: 'true'
          JWT_KEY: dfy-openapi-export-only-key-32-characters-minimum
          ConnectionStrings__DefaultConnection: Host=localhost;Database=dfy_contract_export;Username=postgres;Password=postgres
        run: |
          dotnet tool install Swashbuckle.AspNetCore.Cli --version 6.9.0 --tool-path .tools
          mkdir -p docs
          ./.tools/swagger tofile --output docs/openapi.json bin/Release/net9.0/DoForYou.API.dll v1
          jq -e '.openapi and .info.title == "DoForYou API" and .paths and .components' docs/openapi.json >/dev/null
          test -s docs/openapi.json

      - name: Generate TypeScript contract declarations
        run: npx --yes openapi-typescript@7.6.1 docs/openapi.json -o docs/openapi.d.ts

      - name: Commit generated contract snapshot on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/openapi.json docs/openapi.d.ts
          if git diff --cached --quiet; then
            echo "Canonical API contract is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(api): refresh generated OpenAPI contract"
            git push
          fi

      - name: Upload canonical OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfy-openapi-v1
          path: |
            docs/openapi.json
            docs/openapi.d.ts
          if-no-files-found: error
          retention-days: 30
