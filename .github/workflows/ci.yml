name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DoForYou.API.csproj

      - name: Build API
        run: dotnet build DoForYou.API.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test DoForYou.Tests/DoForYou.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Export canonical OpenAPI contract
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DFY_OPENAPI_EXPORT: 'true'
          JWT_KEY: dfy-openapi-export-only-key-32-characters-minimum
          ConnectionStrings__DefaultConnection: Host=localhost;Database=dfy_contract_export;Username=postgres;Password=postgres
        run: |
          dotnet tool install Swashbuckle.AspNetCore.Cli --version 6.9.0 --tool-path .tools
          mkdir -p docs
          ./.tools/swagger tofile --output docs/openapi.json bin/Release/net9.0/DoForYou.API.dll v1
          jq -e '.openapi and .info.title == "DoForYou API" and .paths and .components' docs/openapi.json >/dev/null
          test -s docs/openapi.json

      - name: Upload canonical OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfy-openapi-v1
          path: docs/openapi.json
          if-no-files-found: error
          retention-days: 30
